name: Cek Struktur File dan Widget UTS

on: 
    push:
        branches: [ "soal_uts" ]
    pull_request:
        branches: [ "soal_uts" ]


jobs:
  cek-struktur-dan-widget:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Cek Keberadaan File
        run: |
          echo "Mengecek struktur file  gitS/lib/..."
          
          # Cek file main.dart
          if [ ! -f "UTS/lib/main.dart" ]; then 
            echo "❌ File main.dart tidak ditemukan!"
            exit 1
          fi
          
          
          echo "✅ Semua file wajib ditemukan."

      
        
     